# Serve the S2000 dashboard at http://mindy.peer.net/s2000/
# Included inside the existing server { } block in /etc/nginx/sites-available/default.
# The dashboard and its snapshot live in /var/www/s2000/, written by mqtt_s2000.py.

location = /s2000 {
    return 301 /s2000/;
}

location /s2000/ {
    alias /var/www/s2000/;
    index index.html;
}
