# Serve the Amber usage pages at http://mindy.peer.net/usage/
# Include inside the existing server { } block for mindy.peer.net, e.g.
#   include /home/ubuntu/amberhome/usage/deploy/nginx-snippet.conf;
# or copy the location blocks in directly.

location = /usage {
    return 301 /usage/;
}

location /usage/ {
    # Trailing slash strips the /usage prefix before the request reaches the Python server.
    proxy_pass http://127.0.0.1:8765/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    # The Python server redirects / to /<site>-usage.html; keep that under /usage/.
    proxy_redirect / /usage/;
}
