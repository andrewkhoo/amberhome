# Serve the Tuya device page at http://mindy.peer.net/tuya/
# Included inside the existing server { } block in /etc/nginx/sites-available/default.
# The page lives in /var/www/tuya/. /tuya/api/ proxies to status_server.py on 127.0.0.1:8766,
# which queries the Tuya Cloud on each request (credentials in /etc/tuya.env).

location = /tuya {
    return 301 /tuya/;
}

location /tuya/ {
    alias /var/www/tuya/;
    index index.html;
}

location /tuya/api/ {
    proxy_pass http://127.0.0.1:8766/;
    proxy_set_header Host $host;
    proxy_read_timeout 30s;
}
