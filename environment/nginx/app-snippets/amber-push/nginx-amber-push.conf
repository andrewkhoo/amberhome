# Serve the Amber Forecast page at http://mindy.peer.net/amber-push/
# Included inside the existing server { } block in /etc/nginx/sites-available/default.
# The page lives in /var/www/amber-push/, written by build_page.py.

location = /amber-push {
    return 301 /amber-push/;
}

location /amber-push/ {
    alias /var/www/amber-push/;
    index index.html;
}
